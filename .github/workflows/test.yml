# CI pipeline (SPEC §49.5), adapted to Yarn.
name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Tests with coverage (unit + integration)
        run: yarn test:coverage

      - name: Build (ESM + CJS + d.ts)
        run: yarn build
